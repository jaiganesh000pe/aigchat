<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      /* 👇 NEW: this wrapper is what actually scrolls the full distance.
         It is NOT pinned, so its view-timeline updates smoothly the entire way. */
      #video-scroll-wrapper {
        position: relative;
        height: calc(100vh + 8000px); /* must match GSAP's end: "+=8000" */
        view-timeline-name: --scroll-progress;
        view-timeline-axis: block;
      }

      #video-section {
        width: 100%;
        height: 100dvh;
        position: relative;
      }

      #video-container {
        width: 100%;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      #scroll-video {
        height: 100dvh;
        width: 100%;
        object-fit: contain;
      }

      #video-headline {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #000000;
        font-size: 3em;
        font-weight: bold;
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        opacity: 0;
        z-index: 20;
        pointer-events: none;
        margin: 0;
      }

      /* 👇 The button — pure CSS scroll-driven, no JS */
      #video-button {
        position: absolute;
        top: 80%;
        left: 50%;
        transform: translate(-50%, 0);
        z-index: 20;
        padding: 14px 36px;
        background: #ffffff;
        color: #000;
        border: none;
        border-radius: 30px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,0.3);

        animation: button-rise-up linear both;
        animation-timeline: --scroll-progress;   /* 👈 listens to the wrapper, not itself */
        animation-range: 20% 0%;                  /* 👈 CONTROL TIMING HERE */
        position: fixed;
      }

      @keyframes button-rise-up {
        0% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -150px);
        }
      }

      h1 {
        margin-top: 20px;
     
        font-size: 2em;
      }

      p {
        font-size: 1.2em;
      }
    </style>
  </head>
  <body>

    <div id="video-scroll-wrapper">
      <section id="video-section">
        <div id="video-container">
          <video id="scroll-video" preload="auto" muted playsinline></video>
          <h2 id="video-headline">Your Headline Here</h2>
          <button id="video-button">Get Started</button>
        </div>
      </section>
    </div>

    <h1>Welcome to webifc</h1>
    <p>Thanks for stopping by! This is a simple welcome page.</p>

    <!-- GSAP + ScrollTrigger -->
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);

      const video = document.getElementById("scroll-video");
      const headline = document.getElementById("video-headline");

      const MOBILE_VIDEO  = "zoom.mp4";
      const TABLET_VIDEO  = "zoom.mp4";
      const DESKTOP_VIDEO = "zoom.mp4";

      function getVideoSrc() {
        const width = window.innerWidth;
        if (width <= 767) return MOBILE_VIDEO;
        if (width <= 1024) return TABLET_VIDEO;
        return DESKTOP_VIDEO;
      }

      video.src = getVideoSrc();

      document.addEventListener("touchstart", () => {
        video.play();
        video.pause();
      }, { once: true });

      const initVideoScroll = () => {
        video.currentTime = 0;

        ScrollTrigger.getAll().forEach(t => {
          if (t.trigger && t.trigger.id === "video-section") t.kill();
        });

        ScrollTrigger.create({
          trigger: "#video-section",
          start: "top top",
          end: "+=8000",       // 👈 keep this matching the wrapper's height above
          scrub: 1.5,
          pin: true,
          pinSpacing: false,   // 👈 IMPORTANT: wrapper provides the spacing now, not GSAP
          markers: false,
          onUpdate: self => {
            const duration = video.duration || 1;
            video.currentTime = Math.max(0, Math.min(duration, self.progress * duration));

            const p = self.progress;
            if (p < 0.15) {
              const localProgress = p / 0.15;
              gsap.set(headline, { opacity: localProgress, y: 40 - (40 * localProgress) });
            } else if (p < 0.35) {
              gsap.set(headline, { opacity: 1, y: 0 });
            } else if (p < 0.5) {
              const localProgress = (p - 0.35) / 0.15;
              gsap.set(headline, { opacity: 1 - localProgress, y: -60 * localProgress });
            } else {
              gsap.set(headline, { opacity: 0, y: -60 });
            }
          }
        });
      };

      if (video.readyState >= 1) {
        initVideoScroll();
      } else {
        video.addEventListener("loadedmetadata", initVideoScroll, { once: true });
      }

      video.load();
    </script>
  </body>
</html>
